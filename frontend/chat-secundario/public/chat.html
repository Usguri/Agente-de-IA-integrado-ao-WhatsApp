<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
  <link rel="stylesheet" href="./css/style.css">
  <title>Chat</title>
  <style>
    ul {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    li {
      padding: 8px;
      margin-bottom: 10px;
      background-color: #f3f3f3;
    }

    input {
      padding: 10px;
      width: 80%;
    }

    button {
      padding: 10px;
    }
  </style>
</head>

<body>

  <section class="container">
    <header>
      <div class="header__text">bot</div>
    </header>
    <section class="chat">
      <section class="chat__messages">

      </section>

      <form id="form" class="chat__form" action="">
        <input type="text" id="input" autocomplete="off" class="chat__input" placeholder="Digite uma mensagem"
          required />
        <button type="submit" class="chat__button"> <span class="material-symbols-outlined">send</span></button>
      </form>
    </section>
  </section>

  <script src="/socket.io/socket.io.js"></script>
  <script src="./js/script.js"></script>

</body>
