<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Cotribá</title>
  <link rel="icon" href="/image/icone-cotriba.ico" type="image/x-icon">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container.login {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-image: url("image/background.png");
    }

    #login-container {
      font-family: Arial, sans-serif;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 350px;
    }

    #login-container h2 {
      margin-bottom: 20px;
      color: #333;
    }

    #login-container input {
      width: 90%;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    #login-container button {
      width: 50%;
      padding: 10px;
      color: white;
      border: none;
      background-color: darkgreen;
      border-radius: 5px;
      cursor: pointer;
    }

    #versao {
      margin-top: 10px;
      color: black;
      font-size: 14px;
    }


    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    /* Estilos do modal de carregamento */
    .loading-modal {
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      text-align: center;
    }

    .spinner {
      border: 5px solid rgba(0, 0, 0, 0.1);
      border-top: 5px solid darkgreen;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 10px;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    .loading-text {
      font-size: 16px;
      color: white;
    }
  </style>

</head>

<body>
  <div class="container login">
    <section id="login-container">
      <h2>Login</h2>
      <input type="text" id="usuario" placeholder="Usuário" required />
      <input type="password" id="senha" placeholder="Senha" onkeydown="verificarEnter(event)" required />
      <button id="login-btn">Login</button>
      <p id="versao">V01</p>
    </section>

    <div class="overlay" id="loading-container" style="display: none;">
      <div class="loading-modal">
        <div class="spinner"></div>
        <div class="loading-text">Carregando...</div>
      </div>
    </div>

  </div>

  <script type="module" src="js/login.js"></script>
</body>

</html>
