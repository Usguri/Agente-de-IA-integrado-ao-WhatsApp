<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Cotribá</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" href="/image/icone-cotriba.ico" type="image/x-icon">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/libphonenumber-js/1.9.30/libphonenumber-js.min.js"></script>

    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 9999;
        }
    </style>

</head>

<body class="fd-body-chat">
    <div class="container-fluid" style="padding-top: 8px;">

        <div class="row" style="margin: 0px;">
            <div class="col-2">
                <div class="row sidebar-header">
                    <div style="display: flex; align-items: center; padding:0px">
                        <div style="flex-grow: 0;">
                            <img rel="icon" src="/image/icone-cotriba.ico" style="width: 25px;">
                        </div>
                        <div style="flex-grow: 1; padding-left: 10px;">
                            <span class="logochatcotriba" style="display: block; line-height: 1.2;">
                                Chat Cotribá
                            </span>
                        </div>
                    </div>

                    <div class="col barra-pesquisa" style="padding:0px">
                        <button type="button" id="icone-pesquisa" class="btn btn-success btn-sm pesquisa__button">
                            <i class="fa fa-search" aria-hidden="true"></i>
                        </button>
                        <button type="button" id="icone-arrow-left" class="btn btn-success btn-sm pesquisa__button"
                            style="display: none;" onclick="LimparPesquisa()">
                            <i class="fas fa-arrow-left" aria-hidden="true"></i>
                        </button>
                        <input type="text" class="input-field" oninput="escolhecontato(value)" id="contato"
                            aria-describedby="inputGroup-sizing-sm" placeholder="Pesquisar">
                    </div>
                </div>
            </div>
            <div class="col-10">
                <div class="row chat-header">
                    <div class="col-md-4">
                        <b class="header__text"></b>
                    </div>
                    <div class="col-md-4 offset-md-4">
                        <button type="button" class="btn btn-secondary btn-sm button-sair" onclick="sairdochat()"
                            style="display: flex;">Sair</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="row" style="margin: 0px;">
            <div class="col-2">
                <div class="row">
                    <div class="sidebar-chat-list" id='sidebar-chat-list'>
                    </div>
                </div>
            </div>

            <div class="col-10 coluna-tm-10">

                <div class="informacoes">Logo da Cotribá</div>

                <div class="row chat-container" style="display: none;">
                    <div class="chat">
                        <div class="chat__messages"></div>
                    </div>
                    <div class="div-form-send-msg" id="IAassumeconversa">
                        <div class="chat__form">
                            <!-- data-balloon-pos="up" data-balloon="Escolher Arquivo"-->
                            <div class="btn-group dropup" style="display: flex;">
                                <button type="button" class="btn btn-outline-primary" title="IA assume a conversa"
                                    onclick="IAAssumeConversa()" style="border: none; border-radius: 4px;">
                                    <i class="fas fa-robot" style="size: 30px;"></i>
                                </button>
                                <button class="btn btn-outline-secondary" type="button" data-bs-toggle="dropdown"
                                    aria-expanded="false" title="Escolha um arquivo" id="button-escolhe-arquivo"
                                    style="border-color: white; border-radius: 4px;">
                                    <i class="fa fa-plus" style="font-size: 20px;" id="id-mais"></i>
                                </button>
                                <ul class="dropdown-menu">
                                    <li>
                                        <button class="dropdown-item" onclick="ChamaArquivo('Documento')">
                                            <i class="fa-solid fa-file"></i> Documento
                                        </button>
                                    </li>
                                    <li>
                                        <button class="dropdown-item" onclick="ChamaArquivo('Foto')">
                                            <i class="fa-regular fa-image"></i> Foto
                                        </button>
                                    </li>
                                </ul>
                            </div>

                            <input type="text" id="inputmsgtxt" autocomplete="off" class="chat__input"
                                placeholder="Digite uma mensagem" required />

                            <div class="col" style="display: none;" id="mostraArquivo">
                                <input id="inputimagem" type="file" accept=".jpg, .jpeg, .png"
                                    style="float: left; margin-top: 4px; display: none;">
                                <input id="inputarquivo" type="file" accept=".pdf"
                                    style="float: left; margin-top: 4px; display: none;">
                                <button title="Deletar Imagem" class="btn btn-outline-danger btn-sm"
                                    onclick="Deletararquivo()" style="float: right; border-color: white;">
                                    <i class="fa fa-trash" aria-hidden="true"></i>
                                </button>
                            </div>

                            <button type="submit" class="chat__button" onclick="clbenviamsg()">
                                <svg viewBox="0 0 24 24" height="24" width="24" id="sendmensagem" version="1.1" x="0px"
                                    y="0px" enable-background="new 0 0 24 24">
                                    <title>send</title>
                                    <path fill="currentColor"
                                        d="M1.101,21.757L23.8,12.028L1.101,2.3l0.011,7.912l13.623,1.816L1.112,13.845 L1.101,21.757z">
                                    </path>
                                </svg>
                                <div class="spinner-border" role="status" id="loadingsend" style="display: none;">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </button>
                        </div>
                    </div>
                    <div class="div-form-send-msg" style="display: none;" id="clbassumeconversa">
                        <div class="card" style="margin-top: 10px;">
                            <div class="card-body">
                                <button type="button" class="btn btn-outline-warning"
                                    onclick="AssumirConverComCliente()"
                                    style="text-align: center; left: 50%; position: relative; right: 50%; border-color: white;">
                                    <i class="fas fa-hand-paper" aria-hidden="true" style="size: 30px;"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="loading-container">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div id="image-big-select" class="modal-overlay" onclick="closeModalImage(event)"">
        <img src="" class=" rounded" id="printarImagem" alt="cardapio.jpg" style="width: 700px; height: 700px;">
    </div>

    <div id="audio-cliente-select" class="modal-overlay" onclick="closeModalAudio(event)"">
    </div>

    <script src=" js/functions.js">
    </script>
</body>

</html>
